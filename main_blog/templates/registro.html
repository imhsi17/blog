{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Registro</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" href="{% static 'img/favicon.ico' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body{
    background: #232526;  /* fallback for old browsers */
}
    </style>
</head>
<body>

    <div class="container" id="login-box">
        <div class="row">
            <label for="exampleInputEmail1" class="form-label text-center fs-3">Registro Usuario</label>
            <p>Regístrate gratis y podrás recibir información de futuras publicaciones.</p>
        </div>
        <div class="row">
            <form action="" method="post">
                {% csrf_token %}
                <div class="row">
                    <div class="col-6">
                        <div class="form-floating mb-3">
                            <input type="text" name="nombre" class="form-control" id="floatingInput" required placeholder="">
                            <label for="floatingInput">Nombre</label>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="form-floating mb-3">
                            <input type="text" name="apellido" class="form-control" id="floatingInput" required placeholder="">
                            <label for="floatingInput">Apellido</label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <div class="form-floating mb-3">
                            <input type="text" name="correo" class="form-control" id="floatingInput" required placeholder="">
                            <label for="floatingInput">Correo</label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    {% if mensaje %}
                    <div class="alert alert-danger" role="alert">
                        {{ mensaje }}
                    </div>
                    {% endif %}
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
    </script>
</body>
</html>
